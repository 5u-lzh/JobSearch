<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobLab · AI 求职技能情报平台</title>
<link rel="stylesheet" href="/static/style.css?v=product-mvp-v0.7-history-fix">
</head>
<body>

<!-- 星空粒子背景 -->
<canvas id="starCanvas"></canvas>

<!-- ═══ 左侧图标导航 (64px) ═══ -->
<nav id="navBar">
  <div class="nav-logo">JL</div>
  <div class="nav-icons">
    <button class="nav-icon active" data-view="chat" title="智能对话">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="nav-icon" data-view="radar" title="技能雷达">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    </button>
    <button class="nav-icon" data-view="gap" title="技能差距">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-7"/><path d="M7 19v-4"/><path d="M11 19v-8"/><path d="M15 19v-5"/><path d="M19 19V7"/></svg>
    </button>
    <button class="nav-icon" data-view="research" title="深度研究">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </button>
  </div>
  <div class="nav-bottom">
    <button class="nav-icon" data-view="user" title="用户中心">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>
</nav>

<!-- ═══ 会话列表栏 (220px) ═══ -->
<aside id="sessionPanel">
  <div class="session-header">
    <span class="session-title">对话</span>
    <button id="btnNewChat" class="btn-new-chat" title="新对话">+</button>
  </div>
  <div class="session-list" id="convList"></div>
</aside>

<!-- ═══ 主内容区 ═══ -->
<main id="mainContent">
  <!-- 视图: 智能对话 -->
  <div id="viewChat" class="view active">
    <div id="messageList"></div>
    <div id="rankingViewChat" class="ranking-inline" style="display:none"></div>
    <div id="inputArea">
      <input type="text" id="chatInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行" autocomplete="off" />
      <button id="btnSend">发送</button>
    </div>
  </div>

  <!-- 视图: 技能雷达 -->
  <div id="viewRadar" class="view">
    <div class="radar-top">
      <div class="radar-search">
        <input type="text" id="radarInput" placeholder="输入岗位名称，查看技能全景..." autocomplete="off" />
        <button id="btnRadarSearch">分析</button>
      </div>
      <div class="radar-tags-toggle" id="radarTagsToggle">
        <span class="tags-toggle-label">已分析岗位</span>
        <svg class="tags-toggle-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="radar-quick-tags collapsed" id="radarQuickTags"></div>
    </div>
    <div class="radar-body" id="radarBody">
      <div class="radar-empty">◇ 输入岗位名称，探索技能全景</div>
    </div>
  </div>

  <!-- 视图: 适配分析工作台 -->
  <div id="viewGap" class="view">
    <!-- 顶部：岗位输入 + 流程状态 -->
    <div class="gap-top">
      <div class="gap-search">
        <input type="text" id="gapJobInput" placeholder="目标岗位，例如 Python后端" autocomplete="off" />
        <button id="btnGapLoad">加载技能</button>
      </div>
      <div class="gap-stepper" id="gapStepper">
        <span class="step" data-step="1">① 岗位画像</span>
        <span class="step-arrow">→</span>
        <span class="step" data-step="2">② 简历画像</span>
        <span class="step-arrow">→</span>
        <span class="step" data-step="3">③ 适配分析</span>
      </div>
    </div>

    <!-- Tab 内容区 -->
    <div class="gap-tabs">
      <div class="gap-tab-bar">
        <button class="gap-tab active" data-tab="capture">岗位采集</button>
        <button class="gap-tab" data-tab="resume">简历画像</button>
        <button class="gap-tab" data-tab="fit">适配分析</button>
        <button class="gap-tab" data-tab="history">历史报告</button>
      </div>

      <!-- Tab 1: 岗位采集 -->
      <div class="gap-tab-panel active" id="tabCapture">
        <!-- Boss 采集表单 -->
        <div class="boss-capture-panel" id="bossCapturePanel">
          <div class="boss-capture-header">
            <span class="gap-label">Boss 岗位采集</span>
            <button class="gap-mini-btn" id="btnToggleBossCapture">展开</button>
          </div>
          <div class="boss-capture-body collapsed" id="bossCaptureBody">
            <div class="boss-browser-controls">
              <span class="boss-browser-status" id="bossBrowserStatus">浏览器: 未启动</span>
              <button class="boss-capture-btn start" id="btnStartBrowser">启动浏览器</button>
              <button class="boss-capture-btn stop" id="btnStopBrowser" style="display:none;">停止浏览器</button>
              <button class="boss-capture-btn retry" id="btnRetryAfterLogin" style="display:none;">我已完成登录，重试采集</button>
            </div>
            <div class="boss-capture-form">
              <input type="text" id="bossJobInput" placeholder="岗位关键词，例如 AI Agent" />
              <input type="text" id="bossCityInput" placeholder="城市，例如 杭州" />
              <select id="bossExpFilter">
                <option value="">经验不限</option>
                <option value="应届">应届</option>
                <option value="1-3年">1-3年</option>
                <option value="3-5年">3-5年</option>
                <option value="5-10年">5-10年</option>
              </select>
              <select id="bossEduFilter">
                <option value="">学历不限</option>
                <option value="大专">大专</option>
                <option value="本科">本科</option>
                <option value="硕士">硕士</option>
              </select>
              <input type="number" id="bossMaxJobs" value="10" min="1" max="30" placeholder="数量" />
              <button class="boss-capture-btn" id="btnBossCapture">启动采集</button>
            </div>
            <div class="boss-capture-alt">
              <span class="gap-subtle">或手动粘贴 JD 文本：</span>
              <textarea id="bossManualJdInput" rows="3" placeholder="粘贴 JD 原文..."></textarea>
              <button class="gap-mini-btn" id="btnBossManualImport">导入 JD</button>
            </div>
            <div id="bossCaptureStatus" class="boss-capture-status"></div>
            <button class="boss-capture-btn rebuild" id="btnRebuildProfile" style="display:none;">重新生成画像</button>
          </div>
        </div>
        <!-- 岗位画像卡片 -->
        <div id="jobProfileCard" class="profile-card-container"></div>
      </div>

      <!-- Tab 2: 简历画像 -->
      <div class="gap-tab-panel" id="tabResume">
        <div class="resume-section">
          <div class="gap-section-head">
            <div>
              <div class="gap-label">简历画像</div>
              <div class="gap-subtle">粘贴简历或上传文本版 PDF/DOCX/TXT</div>
            </div>
          </div>
          <textarea id="resumeTextInput" rows="6" placeholder="粘贴简历、项目经历，或描述你做过的项目"></textarea>
          <div class="gap-profile-actions">
            <input type="file" id="resumeFileInput" accept=".pdf,.docx,.txt,.md" />
            <button class="gap-mini-btn" id="btnResumeProfile">识别画像</button>
          </div>
          <div id="resumeParseStatus" class="gap-subtle" style="margin-top:0.3rem;"></div>
        </div>
        <!-- 候选人画像卡片 -->
        <div id="candidateProfileCard" class="profile-card-container"></div>
      </div>

      <!-- Tab 3: 适配分析 -->
      <div class="gap-tab-panel" id="tabFit">
        <div class="fit-summary-row">
          <div id="fitJobSummary" class="fit-summary-card">
            <div class="gap-label">岗位画像</div>
            <div class="gap-subtle">请先完成岗位采集</div>
          </div>
          <div id="fitCandSummary" class="fit-summary-card">
            <div class="gap-label">候选人画像</div>
            <div class="gap-subtle">请先上传简历</div>
          </div>
        </div>
        <div class="gap-extra">
          <div class="gap-label">补充技能</div>
          <textarea id="gapExtraInput" rows="2" placeholder="Python, MySQL, Git（可选）"></textarea>
        </div>
        <button class="gap-analyze-btn" id="btnGapAnalyze">分析适配度</button>
        <div id="gapResult" class="gap-result-area">
          <div class="gap-result-empty">完成岗位采集和简历画像后，点击上方按钮分析适配度</div>
        </div>
      </div>

      <!-- Tab 4: 历史报告 -->
      <div class="gap-tab-panel" id="tabHistory">
        <div id="fitReportHistory" class="fit-history-list">
          <div style="font-size:0.68rem;color:var(--text-muted);padding:0.4rem;">暂无历史报告</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 视图: 深度研究 -->
  <div id="viewResearch" class="view">
    <div class="research-top">
      <textarea id="researchInput" placeholder="描述你想研究的内容，例如：帮我全面分析深圳AI大模型方向的求职情况" rows="2"></textarea>
      <button id="btnResearch">开始研究</button>
    </div>
    <div class="research-timeline" id="researchTimeline"></div>
    <div class="research-body" id="researchBody"></div>
  </div>

  <!-- 视图: 用户中心 -->
  <div id="viewUser" class="view">
    <div class="user-hero">
      <div class="user-avatar" id="userAvatar">U</div>
      <div>
        <div class="user-name" id="userName"></div>
        <div class="user-meta" id="userMeta"></div>
      </div>
    </div>
    <div class="user-stats" id="userStats"></div>
    <div class="user-switch-section">
      <div class="section-title">切换用户</div>
      <div class="user-switch-list" id="userSwitchList"></div>
      <button class="btn-switch-add" id="btnAddUser">+ 创建新用户</button>
    </div>
  </div>
</main>

<!-- ═══ 情报面板 (260px) ═══ -->
<aside id="insightPanel">
  <div id="insightContent">
    <div class="insight-empty">完成分析后，情报将在此展示</div>
  </div>
</aside>

<!-- Toast -->
<div id="toastContainer"></div>

<script src="/static/app.js?v=product-mvp-v0.24.1-history-fix"></script>
</body>
</html>
